name: Android build and verification
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Unit tests, lint and APK
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
            gradle/wrapper/
            gradlew
            gradlew.bat
  device-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class org.multichat.android.SmokeTest org.multichat.android.test/androidx.test.runner.AndroidJUnitRunner > instrumentation.txt
            cat instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
            adb pull /sdcard/Android/data/org.multichat.android/files/screenshots screenshots
            test -f screenshots/04-chat.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test
          path: |
            instrumentation.txt
            screenshots/
