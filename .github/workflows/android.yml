name: Android build and verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Unit tests, lint and APK
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Generate portable Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
            gradle/wrapper/
            gradlew
            gradlew.bat
  device-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Android/data/org.multichat.android/files/screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
